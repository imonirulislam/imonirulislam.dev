changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - renovate-bot
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
    - title: 🛠️ Refactoring
      labels:
        - refactor
    - title: 📚 Documentation
      labels:
        - doc
        - documentation
    - title: ⚙️ Chore
      labels:
        - chore
